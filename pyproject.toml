[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprime"
version = "1.0.0"
description = "A Python package for pyprime scientific analysis tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "PyPrime Authors", email = "info@example.com" },
]
dependencies = [
  "matplotlib>=3.10,<3.11",
  "numpy>=1.26,<2.0",
  "pandas>=3.0,<3.1",
  "paramiko>=4.0,<4.1",
  "pyvista>=0.47,<0.48",
  "scipy>=1.16,<1.17",
  "scp>=0.15,<0.16",
  "Shapely>=2.1,<2.2",
  "sympy>=1.14,<1.15",
  "tqdm>=4.67,<5.0",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["pyprime*"]
